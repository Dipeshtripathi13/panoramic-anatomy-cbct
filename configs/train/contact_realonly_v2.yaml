# Retuned real-only arm of the contact few-shot grid (same treatment as realonly_v2 on DENTEX): ImageNet init,
# lr 1e-3, 90 epochs (3× the steps), CONTACT val every 3rd epoch. The original real-only arm used the fine-tuning
# schedule (lr 3e-4, 30 epochs); its curves had converged, so this run checks rather than expects a change.
task: crop
run_name: ctfew_realonly_v2
seed: 0
channels: crop
size: 256
real_match_px: 75
synth_train_sets: null
synth_val_sets: null
real_train_frac: 1.0
real_repeat: 1
real_val: true
contact_weight: 0.5
select_metric: real_contact_auc
encoder: resnet34
pretrained: true
init_from: null
epochs: 90
val_every: 3
batch_size: 32
lr: 0.001
weight_decay: 0.0001
dice_weight: 1.0
num_workers: 8
