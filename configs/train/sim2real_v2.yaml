# Long-schedule sim→real arm (reviewer check): same steps as realonly_v2 (120 epochs, real val every 3rd epoch) but the
# fine-tuning lr (3e-4), init from the zero-shot model. fewshot.yaml (40 epochs) gave sim→real 1/3 of the tuned RO budget.
run_name: sim2real_v2
seed: 0
channels: structures+teeth           # same head as the zero-shot model (non-teeth channels get no real loss)
size: [256, 640]
synth_train_sets: null
synth_val_sets: null
real_train_frac: 1.0
real_repeat: 1                       # set per task so every run sees ~384 real samples per epoch
real_val: true
select_on: real
encoder: resnet34
pretrained: true
init_from: null
epochs: 120
val_every: 3
batch_size: 16
lr: 0.0003
weight_decay: 0.0001
dice_weight: 1.0
num_workers: 8
