# No-randomization baseline (PXseg-style CBCT-derived pretraining): nominal renders only (dr_main_v2 v0), no image-level
# DR. Same step budget as seg_v1 (374 images vs 3366 per epoch → 9× the epochs) and validation every 9th epoch, so the
# number of checkpoints considered for selection (60) matches seg_v1. Selection on synthetic val, as for seg_v1.
run_name: seg_nominal
seed: 0
channels: structures+teeth
size: [256, 640]
synth_train_sets: [dr_main_v2]
synth_train_variants: [0]
synth_val_sets: [dr_main_v2]
image_factors: []
real_train_frac: 0.0
real_repeat: 1
real_val: true
select_on: synth
encoder: resnet34
pretrained: true
epochs: 540
val_every: 9
batch_size: 16
lr: 0.001
weight_decay: 0.0001
dice_weight: 1.0
num_workers: 8
