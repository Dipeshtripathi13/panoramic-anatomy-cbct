# Third-molar ROI model (CONTACT-style crops): channels molar (lower third molar) + canal (IAC), sim-only (zero-shot).
# Initialised from the zero-shot panoramic model (encoder + decoder; head molar ← tooth38/48, canal ← canal_L/R).
# crop_v2: same as crop_v1 but with the seg_v2 DR recipe (dr_main_v3 renders = metal ×0.8–1.5, wider image-level ranges),
# initialised from seg_v2_dr_tuned_s<seed>. Question: does seg_v2's synthetic canal drop show up on real CONTACT crops?
# Selection on synthetic val crops; CONTACT val (156) logged only. Test = CONTACT official test (444), scripts/evaluate_contact.py.
task: crop
run_name: crop_v2
seed: 0
channels: crop
size: 256                            # crops are resized to size × size
crop_px: 75.0                        # synthetic crop side in render pixels (0.3 mm) ≈ CONTACT field of view; see crops.py
real_match_px: 75                    # CONTACT images downsampled to the synthetic crop resolution before resizing
synth_train_sets: [dr_main_v3]
synth_val_sets: [dr_main_v2]
image_factors: [noise, processing]
dr_overrides: {photons: 'logu:500:50000', read_noise: 'u:0:0.02', psf_mm: 'u:0:0.8', bg_sigma_mm: 'u:4:30',
               bg_amount: 'u:0.4:0.98', unsharp: 'u:0:2', gamma: 'logu:0.5:2'}
real_train_frac: 0.0
real_repeat: 1
real_val: true
select_on: synth
encoder: resnet34
pretrained: true
init_from: null                      # cluster: $PROJ/runs/seg_v2_dr_tuned_s<seed>/best.pt (set by the job)
init_head_map: {molar: [tooth38, tooth48], canal: [canal_L, canal_R]}
epochs: 30
batch_size: 32
lr: 0.0005
weight_decay: 0.0001
dice_weight: 1.0
num_workers: 8
